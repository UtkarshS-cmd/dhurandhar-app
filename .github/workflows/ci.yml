name: CI

# Phase 12 — GitHub Actions CI/CD.
#
# Two independent jobs so a backend regression and a frontend/E2E regression
# surface in parallel:
#   * backend  — full pytest suite INCLUDING the PostgreSQL integration suite
#                (Phase 9), which runs against a throwaway postgres service
#                container. Locally that suite needs a manual PG instance.
#   * e2e      — Playwright Chromium suite (desktop + mobile projects) against
#                a real uvicorn server started by playwright.config.cjs, with
#                an isolated SQLite DB and the MOCK payment provider.
#
# Deployment (Phase 13) is handled by the existing Render blueprint
# (render.yaml) + Dockerfile; this workflow only proves the build is safe to
# ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dhurandhar
          POSTGRES_PASSWORD: dhurandhar-ci-pw
          POSTGRES_DB: dhurandhar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhurandhar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      # The PG suite refuses to run without this (never falls back to SQLite
      # or the production DATABASE_URL).
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://dhurandhar:dhurandhar-ci-pw@127.0.0.1:5432/dhurandhar_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend test suite (SQLite + PostgreSQL)
        working-directory: backend
        run: python -m pytest tests -q

  e2e:
    name: E2E (Playwright, Chromium desktop + mobile)
    runs-on: ubuntu-latest
    env:
      # No backend/.venv on the runner: the launcher and seed helper use the
      # interpreter installed by setup-python instead.
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        # package-lock.json is intentionally not committed (see .gitignore),
        # so plain npm install resolves @playwright/test@1.49.1.
        run: npm install

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
