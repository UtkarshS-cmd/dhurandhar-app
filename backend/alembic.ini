[alembic]
script_location = %(here)s/alembic
# Portable placeholder: backend/alembic/env.py overrides this with the
# DATABASE_URL coming from backend/app/config.py (env + backend/.env).
sqlalchemy.url = sqlite:///./dhurandhar.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
